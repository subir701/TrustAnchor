services:
  # 🐘 The Database (Internal to Docker)
  db:
    image: postgres:14-alpine
    container_name: trust-anchor-db
    environment:
      - POSTGRES_DB=trustanchor_db
      - POSTGRES_USER=ironman
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ironman -d trustanchor_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ☕ Your Spring Boot App
  app:
    build: .
    container_name: trust-anchor-v1
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      # Internal Docker connection to the 'db' service
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/trustanchor_db
      - SPRING_DATASOURCE_USERNAME=ironman
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      # External connection to your Native WSL Redis and Windows Ollama
      - SPRING_DATA_REDIS_HOST=host.docker.internal
      - SPRING_DATA_REDIS_PORT=6379
      - LANGCHAIN4J_OLLAMA_CHAT_MODEL_BASE_URL=http://host.docker.internal:11434
      - LANGCHAIN4J_OLLAMA_EMBEDDING_MODEL_BASE_URL=http://host.docker.internal:11434
      # JVM Memory Guardrails
      - JAVA_TOOL_OPTIONS=-Xms256m -Xmx512m
    restart: unless-stopped